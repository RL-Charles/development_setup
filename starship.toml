palette = "catppuccin_mocha"
add_newline = true

format = "$username$hostname$directory$git_branch$git_status$fill$cmd_duration$line_break$character"

[username]
show_always = true
style_user = "bold mauve"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold blue"
format = "[@$hostname]($style) "

[directory]
style = "bold sapphire"
read_only = " ro"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only](red) "

[git_branch]
symbol = "git:"
style = "bold pink"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"

[fill]
symbol = " "

[cmd_duration]
min_time = 1000
style = "overlay1"
format = "[took $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
