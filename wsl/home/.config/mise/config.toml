# WSL (Ubuntu) toolchain. Mirrors omarchy/home/.config/mise/config.toml, plus
# the CLI tools Omarchy gets from pacman, so no sudo is needed to install them.
# Claude Code is left out: it uses its own native installer and auto-updates.
[tools]
# Omarchy base CLI tools
bat = "latest"
btop = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
starship = "latest"
tree-sitter = "latest"
zoxide = "latest"
"github:herdrdev/herdr" = "latest"

# Personal tools (same as Omarchy)
codex = "latest"
crush = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
gh = "latest"
node = "26.8.1"
opencode = "latest"
pi = "latest"
uv = "latest"

[settings.upgrade]
auto_prune = false
