<!doctype html>
<!-- Omarchy-style top bar for GlazeWM: every screen's workspaces, grouped
     behind a laptop / monitor icon, the shown ones highlighted; clock in the
     middle. Tokyo Night colours to match the GlazeWM borders. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1a1b26;
        --fg: #a9b1d6;
        --muted: #565f89;
        --accent: #7aa2f7;
        --shown: #3b4261;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 600 12px 'CaskaydiaMono Nerd Font', 'Cascadia Mono', ui-monospace, monospace;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 10px;
        user-select: none;
      }
      #workspaces { display: flex; align-items: center; gap: 2px; }
      .screen { color: var(--muted); padding: 0 6px 0 2px; font-size: 14px; }
      .screen.here { color: var(--accent); }
      .sep { color: var(--shown); padding: 0 8px; }
      .ws {
        all: unset;
        cursor: pointer;
        min-width: 22px;
        padding: 1px 4px;
        text-align: center;
        color: var(--muted);
      }
      .ws.occupied { color: var(--fg); }
      .ws.shown { color: var(--fg); background: var(--shown); }
      .ws.focused { color: var(--bg); background: var(--accent); }
      #right { justify-self: end; color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="workspaces"></div>
    <div id="clock"></div>
    <div id="right"></div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.0';

      // The laptop's built-in panel (GlazeWM `query monitors` hardwareId);
      // any other screen gets the monitor icon
      const LAPTOP_ID = 'SDC41B4';
      const LAPTOP_ICON = '\u{f0322}'; // nf-md-laptop
      const MONITOR_ICON = '\u{f0379}'; // nf-md-monitor

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: 'EEE, MMM d h:mm a' },
      });

      const wsEl = document.getElementById('workspaces');
      const clockEl = document.getElementById('clock');
      const rightEl = document.getElementById('right');

      function render() {
        const { glazewm, date } = providers.outputMap;
        clockEl.textContent = date?.formatted ?? '';
        if (!glazewm) return;

        // One group per screen, laptop first, each behind its icon. The icon
        // of the screen this bar sits on is lit.
        const monitors = [...glazewm.allMonitors].sort((a, b) =>
          (b.hardwareId === LAPTOP_ID) - (a.hardwareId === LAPTOP_ID) || a.x - b.x);
        const focusedId = glazewm.focusedWorkspace?.id;

        wsEl.replaceChildren(...monitors.flatMap((monitor, i) => {
          const icon = document.createElement('span');
          icon.className = 'screen'
            + (monitor.id === glazewm.currentMonitor?.id ? ' here' : '');
          icon.textContent = monitor.hardwareId === LAPTOP_ID ? LAPTOP_ICON : MONITOR_ICON;

          const workspaces = [...monitor.children]
            .sort((a, b) => Number(a.name) - Number(b.name))
            .map(ws => {
              const button = document.createElement('button');
              button.className = 'ws'
                + (ws.children?.length ? ' occupied' : '')
                + (ws.isDisplayed ? ' shown' : '')
                + (ws.id === focusedId ? ' focused' : '');
              button.textContent = ws.displayName ?? ws.name;
              button.onclick = () => glazewm.runCommand(`focus --workspace ${ws.name}`);
              return button;
            });

          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = '\u2502';
          return i ? [sep, icon, ...workspaces] : [icon, ...workspaces];
        }));

        const modes = glazewm.bindingModes.map(m => m.displayName ?? m.name);
        if (glazewm.isPaused) modes.unshift('paused');
        rightEl.textContent = modes.join('  ');
      }

      render();
      providers.onOutput(render);
    </script>
  </body>
</html>
