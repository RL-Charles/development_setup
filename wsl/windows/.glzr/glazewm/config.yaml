# GlazeWM config: Omarchy's Hyprland keybindings and look, on the Win key.
# Source of truth: ~/.local/share/omarchy/default/hypr/bindings/*.lua plus the
# overrides in omarchy/home/.config/hypr/bindings.lua.
# Windows keeps a few Win combos for itself (Win+L lock, Win+Shift+S screenshot,
# Win+. emoji), which line up with Omarchy's own lock/screenshot/emoji keys.
# Reload after editing with Win+Shift+Alt+R.

general:
  # Zebar draws the Omarchy-style workspace bar (~/.glzr/zebar/omarchy)
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  # Hyprland follow_mouse = 1
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

# Omarchy: gaps_in 5, gaps_out 10, border 2, no rounding
gaps:
  scale_with_dpi: true
  inner_gap: '10px'
  outer_gap:
    top: '10px'
    right: '10px'
    bottom: '10px'
    left: '10px'

# Tokyo Night accent / muted
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7aa2f7'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
  other_windows:
    border:
      enabled: true
      color: '#414868'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      # Fill the screen without telling the app, so browsers keep their tabs
      # (matches the SUPER+F override on Omarchy)
      maximized: false
      shown_on_top: false

# 1-5 always exist, like Omarchy's persistent workspaces; 6-9 come and go.
# 1-3 live on the laptop (monitor 0), 4-5 on the external screen (monitor 1);
# unplugged, they fall back to the laptop.
workspaces:
  - name: '1'
    keep_alive: true
    bind_to_monitor: 0
  - name: '2'
    keep_alive: true
    bind_to_monitor: 0
  - name: '3'
    keep_alive: true
    bind_to_monitor: 0
  - name: '4'
    keep_alive: true
    bind_to_monitor: 1
  - name: '5'
    keep_alive: true
    bind_to_monitor: 1
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      # Zebar top bar (workspace indicator)
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDropShadowWindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'Microsoft.CmdPal.UI' }
      - window_process: { equals: 'WinCompose' }
      - window_title: { equals: 'copy-popup' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # Applications
  - commands: ['shell-exec wt.exe']
    bindings: ['lwin+enter']
  - commands: ['shell-exec wt.exe -p Ubuntu wsl.exe -d Ubuntu --cd ~ -- bash -lic herdr']  # Herdr
    bindings: ['lwin+ctrl+enter']
  - commands: ['shell-exec wt.exe -p Ubuntu wsl.exe -d Ubuntu --cd ~ -- bash -lic "tmux attach || tmux new -s Work"']  # Tmux
    bindings: ['lwin+alt+enter']
  - commands: ['shell-exec wt.exe -p Ubuntu wsl.exe -d Ubuntu --cd ~ -- bash -lic "nvim ."']  # Editor
    bindings: ['lwin+shift+n']
  - commands: ['shell-exec wt.exe -p Ubuntu wsl.exe -d Ubuntu --cd ~ -- bash -lic btop']  # Activity
    bindings: ['lwin+ctrl+t']
  - commands: ['shell-exec msedge']  # Browser
    bindings: ['lwin+shift+enter']
  - commands: ['shell-exec msedge']  # Browser
    bindings: ['lwin+shift+b']
  - commands: ['shell-exec msedge --inprivate']  # Browser (private)
    bindings: ['lwin+shift+alt+b']
  - commands: ['shell-exec explorer.exe']  # File manager
    bindings: ['lwin+shift+f']

  # Windows
  - commands: ['close']
    bindings: ['lwin+w', 'lwin+q']
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+j']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+t']
  - commands: ['toggle-fullscreen']
    bindings: ['lwin+f']
  - commands: ['toggle-minimized']
    bindings: ['lwin+m']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']
  # Win+-/= : resize 100px on Omarchy; add Shift for height. GlazeWM calls the -/= keys oem_minus/oem_plus
  - commands: ['resize --width -5%']
    bindings: ['lwin+oem_minus']
  - commands: ['resize --width +5%']
    bindings: ['lwin+oem_plus']
  - commands: ['resize --height -5%']
    bindings: ['lwin+shift+oem_minus']
  - commands: ['resize --height +5%']
    bindings: ['lwin+shift+oem_plus']
  # Win+alt+-/= : resize a little (25px)
  - commands: ['resize --width -2%']
    bindings: ['lwin+alt+oem_minus']
  - commands: ['resize --width +2%']
    bindings: ['lwin+alt+oem_plus']
  - commands: ['resize --height -2%']
    bindings: ['lwin+alt+shift+oem_minus']
  - commands: ['resize --height +2%']
    bindings: ['lwin+alt+shift+oem_plus']
  # Win+ctrl+-/= : resize a lot (300px)
  - commands: ['resize --width -15%']
    bindings: ['lwin+ctrl+oem_minus']
  - commands: ['resize --width +15%']
    bindings: ['lwin+ctrl+oem_plus']
  - commands: ['resize --height -15%']
    bindings: ['lwin+ctrl+shift+oem_minus']
  - commands: ['resize --height +15%']
    bindings: ['lwin+ctrl+shift+oem_plus']
  - commands: ['focus --direction left']
    bindings: ['lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+down']
  - commands: ['move --direction left']
    bindings: ['lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+down']

  # Workspaces
  - commands: ['focus --next-active-workspace']
    bindings: ['lwin+tab']
  - commands: ['focus --prev-active-workspace']
    bindings: ['lwin+shift+tab']
  - commands: ['focus --recent-workspace']
    bindings: ['lwin+ctrl+tab']
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['lwin+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['lwin+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['lwin+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['lwin+shift+9']
  - commands: ['move --workspace 1']
    bindings: ['lwin+shift+alt+1']
  - commands: ['move --workspace 2']
    bindings: ['lwin+shift+alt+2']
  - commands: ['move --workspace 3']
    bindings: ['lwin+shift+alt+3']
  - commands: ['move --workspace 4']
    bindings: ['lwin+shift+alt+4']
  - commands: ['move --workspace 5']
    bindings: ['lwin+shift+alt+5']
  - commands: ['move --workspace 6']
    bindings: ['lwin+shift+alt+6']
  - commands: ['move --workspace 7']
    bindings: ['lwin+shift+alt+7']
  - commands: ['move --workspace 8']
    bindings: ['lwin+shift+alt+8']
  - commands: ['move --workspace 9']
    bindings: ['lwin+shift+alt+9']
  - commands: ['move-workspace --direction left']
    bindings: ['lwin+shift+alt+left']
  - commands: ['move-workspace --direction right']
    bindings: ['lwin+shift+alt+right']
  - commands: ['move-workspace --direction up']
    bindings: ['lwin+shift+alt+up']
  - commands: ['move-workspace --direction down']
    bindings: ['lwin+shift+alt+down']

  # GlazeWM itself
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+alt+r']
  - commands: ['wm-toggle-pause']
    bindings: ['lwin+shift+alt+p']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+alt+e']
